name: Build and release Baqalaty Pro

on:
  push:
    branches: [ "main", "hybrid-capacitor" ]
  pull_request:
    branches: [ "main", "hybrid-capacitor" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://unylexdkocktkzwvawsu.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: CapacitorApp/package-lock.json

      - name: Install dependencies
        working-directory: CapacitorApp
        run: npm ci --legacy-peer-deps

      - name: Run tests and typecheck
        working-directory: CapacitorApp
        run: |
          npm test
          npm run lint

      - name: Build production web assets
        working-directory: CapacitorApp
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Sync Capacitor Android project
        working-directory: CapacitorApp
        run: npx cap sync android

      - name: Build debug APK for CI testing
        working-directory: CapacitorApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK when signing key is configured
        id: release
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_SIGNING_KEY_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_STORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release APK skipped. Configure the four Android signing secrets to publish a stable update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/baqalati-release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/baqalati-release.jks"
          (cd CapacitorApp/android && ./gradlew assembleRelease --no-daemon)
          cp CapacitorApp/android/app/build/outputs/apk/release/app-release.apk CapacitorApp/BaqalatyPro.apk
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify release signature and Android package metadata
        if: steps.release.outputs.ready == 'true'
        run: |
          APK=CapacitorApp/BaqalatyPro.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "package: name='com.baqalatypro.pos' versionCode='10' versionName='1.4.4'" "$RUNNER_TEMP/apk-badging.txt"
          SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          echo "## Verified Android release" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`BaqalatyPro.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`com.baqalatypro.pos\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`1.4.4 (10)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signature.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaqalatyPro-debug-APK
          path: CapacitorApp/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish permanent release download
        uses: softprops/action-gh-release@v2
        if: steps.release.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hybrid-capacitor'
        with:
          tag_name: v1.4.4
          name: Baqalaty Pro v1.4.4 Release
          prerelease: false
          make_latest: true
          files: CapacitorApp/BaqalatyPro.apk
