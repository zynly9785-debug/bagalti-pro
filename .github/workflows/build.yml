name: Build Capacitor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/sdk.zip
          unzip -q /tmp/sdk.zip -d /tmp/sdk_dir
          mv /tmp/sdk_dir/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare env & install dependencies
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cp .env.example .env.local
          if [ -n "$VITE_SUPABASE_URL" ]; then
            sed -i "s|https://YOUR_PROJECT_REF.supabase.co|$VITE_SUPABASE_URL|g" .env.local
          fi
          if [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            sed -i "s|sb_publishable_REPLACE_WITH_PROJECT_PUBLISHABLE_KEY|$VITE_SUPABASE_PUBLISHABLE_KEY|g" .env.local
          fi
          npm ci --legacy-peer-deps

      - name: Build web & sync Capacitor Android
        run: |
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: capacitor-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
