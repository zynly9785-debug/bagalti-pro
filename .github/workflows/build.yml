name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto Clean and Build Android App
      run: |
        echo "=== التنظيف التلقائي وترتيب المجلدات ==="
        # حذف أي مجلدات نسخ احتياطي قديمة تلقائياً من الجذر لتجنب تداخل مسارات البناء
        rm -rf BagaltiPro/build_backup_* || true
        
        # الانتقال التلقائي لمجلد المشروع
        cd BagaltiPro
        
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
