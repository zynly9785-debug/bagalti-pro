name: Publish Baqalaty Pro download page

on:
  push:
    branches: ["hybrid-capacitor"]
    paths:
      - "download-page/**"
      - ".github/workflows/pages-download.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload download page
        uses: actions/upload-pages-artifact@v3
        with:
          path: download-page
      - name: Publish download page
        id: deployment
        uses: actions/deploy-pages@v4
